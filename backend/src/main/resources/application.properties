# Server
server.port=8080

# H2 file-based database
spring.datasource.url=jdbc:h2:file:./data/capacityplanning;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console is unauthenticated (no Spring Security on the classpath), so it stays off
# by default. Run with --spring.profiles.active=dev (see application-dev.properties) to
# enable it for local inspection.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Serve React static files from classpath:/static (default Spring Boot behavior)
spring.web.resources.static-locations=classpath:/static/

# Story points are a discrete count (int) - reject "storyPoints": 3.5 with a clear 400
# instead of Jackson's default of silently truncating it to 3.
spring.jackson.deserialization.accept-float-as-int=false
