# Server
server.port=8080

# H2 file-based database
spring.datasource.url=jdbc:h2:file:./data/capacityplanning;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console (dev convenience) - TODO: disable before any real deployment
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Serve React static files from classpath:/static (default Spring Boot behavior)
spring.web.resources.static-locations=classpath:/static/
